# Autopilote SEO/actu : sélectionne les sujets du jour (mots-clés DataForSEO +
# actus filtrées depuis le sheet de veille), génère les articles (garde-fou
# anti-hallucination inclus), illustre, vérifie, commit et pousse sur main.
# Le push déclenche le déploiement Vercel habituel (intégration Git).
#
# Secrets à créer une seule fois dans GitHub (Settings > Secrets and variables > Actions) :
#   DATAFORSEO_LOGIN, DATAFORSEO_PASSWORD   — dataforseo.com
#   CLAUDE_CODE_OAUTH_TOKEN                  — généré en local via `claude setup-token`
#                                               (authentifie la CLI avec l'abonnement Claude,
#                                               jamais l'API payante — ne JAMAIS mettre
#                                               ANTHROPIC_API_KEY dans ce workflow, elle serait
#                                               prioritaire sur ce token)
#   UNSPLASH_ACCESS_KEY, PEXELS_API_KEY, PIXABAY_API_KEY  — images libres de droit
#   GSC_SERVICE_ACCOUNT_JSON                 — contenu complet du fichier .secrets/gsc-service-account.json
#   SHEETS_SERVICE_ACCOUNT_JSON               — contenu complet du fichier .secrets/sheets-service-account.json
#   VEILLE_SHEET_ID (optionnel, a une valeur par défaut dans le code)
#
# Déclenchement manuel possible depuis l'onglet Actions (workflow_dispatch) pour tester
# sans attendre le cron, avec les mêmes paramètres --seo/--actu/--dry-run.

name: Autopilote SEO

on:
  schedule:
    # 06:00 UTC = 09:00 à Antananarivo
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      seo:
        description: "Nombre d'articles SEO (hors actu)"
        default: "1"
      actu:
        description: "Nombre d'articles d'actualité"
        default: "2"
      dry_run:
        description: "true = génère sans commit/push"
        type: boolean
        default: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installer les dépendances
        run: npm ci

      - name: Installer la CLI Claude Code (auth par abonnement, pas l'API)
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Restaurer les comptes de service GSC et Sheets
        run: |
          mkdir -p .secrets
          printf '%s' "$GSC_SERVICE_ACCOUNT_JSON" > .secrets/gsc-service-account.json
          printf '%s' "$SHEETS_SERVICE_ACCOUNT_JSON" > .secrets/sheets-service-account.json
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          SHEETS_SERVICE_ACCOUNT_JSON: ${{ secrets.SHEETS_SERVICE_ACCOUNT_JSON }}

      - name: Configurer git (commits de l'autopilote)
        run: |
          git config user.name "autopilote-seo[bot]"
          git config user.email "autopilote-seo@techno-play.com"

      - name: Mémoriser le commit de départ
        run: echo "AVANT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Lancer le pipeline
        env:
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          VEILLE_SHEET_ID: ${{ secrets.VEILLE_SHEET_ID }}
        run: |
          # Article de fond : un jour sur deux (parité du jour UTC). Entrée manuelle prioritaire.
          if [ -n "${{ github.event.inputs.seo }}" ]; then
            SEO="${{ github.event.inputs.seo }}"
          elif [ $(( $(date -u +%s) / 86400 % 2 )) -eq 0 ]; then
            SEO=1
          else
            SEO=0
          fi
          echo "Article de fond aujourd'hui : $SEO"
          ACTU="${{ github.event.inputs.actu || '2' }}"
          DRY="${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}"
          node scripts/seo/run-pipeline.js --seo "$SEO" --actu "$ACTU" --push $DRY

      - name: Indexation (IndexNow + sitemap Google Search Console)
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
        run: |
          NOUVELLES=$(git diff --name-only --diff-filter=A "$AVANT" HEAD -- content/posts | sed -E 's#^content/posts/(.*)\.md$#https://techno-play.com/\1/#')
          NOUVELLES_URLS="$NOUVELLES" node scripts/indexation/submit.mjs

      - name: Images uniques (corriger les doublons, puis vérifier)
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          node scripts/images/corriger-doublons.js
          if ! git diff --quiet -- content/posts; then
            git add content/posts
            git commit -q -m "fix(images): une photo unique par article"
            git push -q origin HEAD:main
          fi
          node scripts/images/verifier-images.js

      - name: Publier le rapport comme artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-pipeline-${{ github.run_id }}
          path: _strategie/rapports-pipeline/*.json
          retention-days: 90
