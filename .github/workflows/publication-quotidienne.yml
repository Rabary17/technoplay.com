# Publication programmée : chaque jour, un commit vide est poussé sur main.
# Vercel reconstruit le site et les articles datés du jour deviennent visibles
# (lib/posts.ts, estPublie). Pas de secret requis : le push utilise GITHUB_TOKEN.

name: Publication quotidienne

on:
  schedule:
    # 05:17 UTC = 08:17 à Antananarivo (décalé de la pleine heure, les départs sont souvent retardés)
    - cron: "17 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  relancer-deploiement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Commit vide sur main (déclenche le build Vercel)
        run: |
          git config user.name "publication-quotidienne[bot]"
          git config user.email "publication-quotidienne@techno-play.com"
          git commit --allow-empty -m "chore: publication quotidienne (rebuild)"
          git push origin HEAD:main
